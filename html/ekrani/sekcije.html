<section id="sekcije" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="sekcije-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="sekcije-naslov">Sekcije i pristup</h2>
    <button id="btn-sekcije-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <div class="sk-hero tr-hero ev-hero">
    <div class="sk-statovi sk-statovi-hero sks-hero">
      <button type="button" data-stat="moje" data-filter-skok="moje"><b id="sks-moje">0</b><span>moje sekcije</span></button>
      <button type="button" data-stat="odobrenje" data-filter-skok="zahtjevi"><b id="sks-odobrenje">0</b><span>za odobrenje</span></button>
      <button type="button" data-stat="ukupno" data-filter-skok="sve"><b id="sks-ukupno">0</b><span>sekcija ukupno</span></button>
    </div>
    <p id="sekcije-uputa" class="sitno sks-uputa"></p>
  </div>
  <div id="sekcije-filter" class="segment sks-filter" role="group" aria-label="Prikaz sekcija"></div>
  <div class="sks-alati">
    <input id="sekcije-trazi" type="search" placeholder="Traži sekciju, revir, lovca…" aria-label="Traži sekcije (sekcija, revir, grupovođa, član)" autocomplete="off">
    <button id="btn-sekcije-osvjezi" class="ikona-dugme" type="button" aria-label="Osvježi sa servera" title="Osvježi sa servera"><svg class="ic" aria-hidden="true"><use href="#ic-osvjezi"/></svg></button>
  </div>
  <button id="btn-sekcija-nova" class="dugme glavno" type="button" hidden>Nova sekcija</button>
  <p id="sekcije-status" class="status" role="status"></p>
  <details id="uloge-detalji" class="uprava" hidden>
  <summary>Grupovođe i lovočuvari po revirima</summary>
  <div id="grupovodje-blok" hidden>
    <h3>Grupovođe revira</h3>
    <p class="sitno">Grupovođa revira smije praviti sekcije u tom reviru. Postavlja ih lovočuvar revira ili administrator.</p>
    <ul id="grupovodje-spisak" class="spisak"></ul>
    <div class="red-dugmadi">
      <select id="grupovodja-korisnik" aria-label="Lovac"></select>
      <select id="grupovodja-revir" aria-label="Revir"></select>
      <button id="btn-grupovodja-dodaj" class="dugme" type="button">Postavi za grupovođu</button>
    </div>
  </div>
  <div id="lovocuvari-blok" hidden>
    <h3>Lovočuvari po revirima (admin)</h3>
    <p class="sitno">Lovočuvar prati sve sekcije svog revira (članove, lovove, poruke), bez upravljanja.</p>
    <ul id="lovocuvari-spisak" class="spisak"></ul>
    <div class="red-dugmadi">
      <select id="lovocuvar-korisnik" aria-label="Lovac"></select>
      <select id="lovocuvar-revir" aria-label="Revir"></select>
      <button id="btn-lovocuvar-dodaj" class="dugme" type="button">Postavi za lovočuvara</button>
    </div>
  </div>
  </details>
  <div id="sekcije-spisak"></div>
  <input id="sekcija-logo-ulaz" type="file" accept="image/*" hidden>
</section>
