<section id="opazanja" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="opazanja-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="opazanja-naslov">Opažanja divljači</h2>
    <button id="btn-opazanja-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <div class="sk-hero tr-hero ev-hero">
    <div class="sk-statovi sk-statovi-hero"><div data-stat="opazanja"><b id="op-stat-opazanja">0</b><span>opažanja</span></div><div data-stat="grla"><b id="op-stat-grla">0</b><span>grla</span></div><div data-stat="vrsta"><b id="op-stat-vrsta">0</b><span>vrsta</span></div></div>
  </div>
  <input id="op-trazi" type="search" placeholder="Traži (vrsta, napomena…)" aria-label="Traži u opažanjima" autocomplete="off">
  <label>Vrsta<select id="op-filter-vrsta"></select></label>
  <h3>Period</h3>
  <div id="op-period" class="segment" role="group" aria-label="Period">
    <button type="button" data-period="30">30 dana</button>
    <button type="button" data-period="90">90 dana</button>
    <button type="button" data-period="godina">Ova godina</button>
    <button type="button" data-period="sve">Sve</button>
  </div>
  <h3>Prikaz na karti</h3>
  <div id="op-prikaz" class="segment" role="group" aria-label="Prikaz">
    <button type="button" data-prikaz="tacke">Tačke</button>
    <button type="button" data-prikaz="gustina">Gustina</button>
  </div>
  <button id="op-na-karti" class="dugme" type="button" aria-pressed="true">Na karti: prikazano</button>
  <h3>Po vrstama</h3>
  <ul id="op-zbir" class="zbir"></ul>
  <ul id="opazanja-spisak" class="spisak"></ul>
</section>
