<section id="lovac-novi" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="ln-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="ln-naslov">Novi lovac</h2>
    <button id="btn-ln-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <p id="ln-uputa" class="sitno"></p>
  <form id="forma-lovac-novi" novalidate>
    <label>Sekcija<select id="ln-sekcija" name="sekcija"></select></label>
    <label id="ln-uloga-blok" hidden>Uloga<select id="ln-uloga" name="uloga"></select></label>
    <label>Ime<input name="ime" maxlength="40" autocomplete="off" required></label>
    <label>Prezime<input name="prezime" maxlength="40" autocomplete="off" required></label>
    <label>Nadimak ili broj člana (neobavezno)<input name="nadimak" maxlength="20" autocomplete="off"></label>
    <label>PIN (6 do 8 cifara)<input name="pin" inputmode="numeric" maxlength="8" autocomplete="off" required></label>
    <p class="sitno">PIN predaj lovcu lično. Preporuči mu da ga odmah promijeni u Postavke → Nalog.</p>
    <button type="submit" id="btn-ln-posalji" class="dugme glavno">Napravi nalog</button>
  </form>
  <p id="ln-status" class="status" role="status"></p>
  <div id="ln-gotovo" class="p-kartica" hidden>
    <h3>Nalog je napravljen</h3>
    <p id="ln-gotovo-tekst"></p>
    <button id="btn-ln-jos" class="dugme" type="button">Dodaj još jednog</button>
  </div>
</section>
