<section id="clanovi-pregled" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="cp-naslov" hidden>
  <header class="postavke-glava"><h2 id="cp-naslov">Članovi i grupe</h2>
    <button id="btn-cp-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button></header>
  <div class="sk-hero tr-hero ev-hero">
    <div class="sk-hero-glava"><span id="cp-uloga" class="tr-chip">Uloga</span><b id="cp-opseg"></b></div>
    <p id="cp-opis" class="sitno"></p>
    <div class="sk-statovi sk-statovi-hero">
      <div data-stat="clanova"><b id="cp-stat-clanova">0</b><span>članova</span></div>
      <div data-stat="grupa"><b id="cp-stat-grupa">0</b><span>grupa</span></div>
      <div data-stat="bez"><b id="cp-stat-bez">0</b><span>bez grupe</span></div>
      <div data-stat="cekaju"><b id="cp-stat-cekaju">0</b><span>čekaju</span></div>
    </div>
  </div>
  <div class="red-dugmadi">
    <input id="cp-trazi" type="search" placeholder="Traži lovca, grupovođu ili sekciju" aria-label="Pretraga članova" autocomplete="off">
  </div>
  <div id="cp-filter" class="segment p-tabovi" role="group" aria-label="Prikaz članova"></div>
  <div class="red-dugmadi">
    <button type="button" id="btn-cp-sve" class="dugme">Rasklopi sve</button>
    <button type="button" id="btn-cp-csv" class="dugme">Izvezi (Excel)</button>
  </div>
  <p id="cp-status" class="sitno" role="status"></p>
  <div id="cp-stablo" class="cp-stablo"></div>
</section>
