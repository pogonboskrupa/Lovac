<section id="lov-uredi" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="lov-uredi-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="lov-uredi-naslov"></h2>
    <button id="btn-lov-uredi-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <p id="lov-uredi-stanje"></p>
  <p id="lov-uredi-status" class="status" role="status"></p>
  <ul id="lov-upozorenja" class="zbir upozorenje-tekst"></ul>
  <div class="red-dugmadi">
    <button id="btn-lov-uredi-karta" class="dugme" type="button">Raspored na karti</button>
    <button id="btn-lov-pokreni" class="dugme glavno" type="button">Pokreni lov</button>
    <button id="btn-lov-zavrsi" class="dugme" type="button">Završi lov</button>
  </div>
  <h3>Učesnici</h3>
  <ul id="lov-ucesnici" class="spisak"></ul>
  <div class="red-dugmadi">
    <select id="lov-dodaj-clan" aria-label="Lovac"></select>
    <select id="lov-dodaj-uloga" aria-label="Uloga"><option value="strijelac">Strijelac</option><option value="pogonic">Pogonič</option><option value="vodja">Vođa lova</option></select>
    <button id="btn-lov-dodaj-clan" class="dugme" type="button">Dodaj učesnika</button>
  </div>
  <h3>Stanovi i zabranjeni pravci</h3>
  <p class="sitno">Pravci prema drugim stanovima aplikacija računa sama. Ručno dodaj pravce prema putevima, kućama i sl. (od–do u stepenima od sjevera, u smjeru kazaljke).</p>
  <button id="btn-lov-dodaj-stan" class="dugme glavno" type="button">Odaberi stan na karti</button>
  <ul id="lov-stanovi" class="spisak"></ul>
</section>
