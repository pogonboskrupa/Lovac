<section id="sekcija-forma" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="sekcija-forma-naslov" hidden>
  <form id="forma-sekcija" novalidate>
    <header class="postavke-glava"><h2 id="sekcija-forma-naslov">Nova sekcija</h2></header>
    <label>Revir<select id="sekcija-revir" name="revir"></select></label>
    <label>Naziv sekcije<input name="naziv" maxlength="60" placeholder="npr. Sekcija 1"></label>
    <div id="sekcija-admin-polja" hidden>
      <label>Lovovođa sekcije<select id="sekcija-grupovodja" name="grupovodja"></select></label>
    </div>
    <h3 id="sekcija-lovci-naslov">Spisak lovaca (odmah odobreni)</h3>
    <div id="sekcija-lovci" class="clanovi"></div>
    <p id="sekcija-forma-status" class="status" role="status"></p>
    <div class="red-dugmadi">
      <button type="submit" class="dugme glavno">Napravi sekciju</button>
      <button type="button" id="btn-sekcija-odustani" class="dugme">Odustani</button>
    </div>
  </form>
</section>
