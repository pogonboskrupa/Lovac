<section id="odstrel-stat" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="ods-stat-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="ods-stat-naslov">Statistika odstrela</h2>
    <button id="btn-ods-stat-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <p class="sitno">Obuhvata zapise na ovom telefonu (tvoje i podijeljene sa tobom). Ne zamjenjuje službeni lovački dnevnik.</p>
  <label>Godina<select id="ods-stat-godina"></select></label>
  <label>Vrsta<select id="ods-stat-vrsta"></select></label>
  <label>Revir<select id="ods-stat-revir"></select></label>
  <label>Sekcija<select id="ods-stat-sekcija"></select></label>
  <p id="ods-stat-ukupno" class="tok-stanje" role="status"></p>
  <h3>Po mjesecima</h3>
  <ul id="ods-stat-mjeseci" class="stat-mjeseci"></ul>
  <h3>Po vrstama</h3>
  <ul id="ods-stat-vrste" class="zbir"></ul>
  <h3>Po revirima</h3>
  <ul id="ods-stat-reviri" class="zbir"></ul>
  <h3>Po sekcijama</h3>
  <ul id="ods-stat-sekcije" class="zbir"></ul>
  <h3>Po lovcima</h3>
  <ul id="ods-stat-lovci" class="zbir"></ul>
  <div class="red-dugmadi">
    <button id="btn-ods-stat-csv" class="dugme" type="button">Izvoz u Excel (CSV)</button>
    <button id="btn-ods-stat-pdf" class="dugme" type="button">Štampa / PDF</button>
  </div>
</section>
