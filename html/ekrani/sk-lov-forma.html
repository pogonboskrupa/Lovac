<section id="sk-lov-forma" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="slf-naslov" hidden>
  <form id="forma-sk-lov" novalidate>
    <header class="postavke-glava"><h2 id="slf-naslov">Novi lov</h2><span id="slf-sekcija" class="sitno"></span></header>
    <label id="slf-sekcija-blok" hidden>Sekcija<select id="slf-sekcija-izbor" name="sekcija"></select></label>
    <label>Naziv lova<input name="naziv" type="text" maxlength="120" autocomplete="off"></label>
    <label>Datum<input name="datum" type="date"></label>
    <label>Okupljanje u (vrijeme)<input name="okupljanje" type="time"></label>
    <label>Mjesto okupljanja i napomena<textarea name="napomena" rows="3" maxlength="1000" placeholder="Npr. kod lovačke kuće, pogon na sjevernoj strani"></textarea></label>
    <h3>Učesnici <span id="slf-broj" class="sitno"></span></h3>
    <p class="sitno">Ti si vođa lova. Za svakog izabranog lovca dodirom biraš Strijelac / Pogonič; ostali se mogu sami prijaviti kao prisutni.</p>
    <div class="slf-alati">
      <button id="btn-slf-svi" class="dugme" type="button">Označi sve</button>
      <button id="btn-slf-zadnji" class="dugme" type="button" hidden>Kao zadnji lov</button>
    </div>
    <input id="slf-trazi" type="search" placeholder="Traži lovca" aria-label="Traži lovca" autocomplete="off">
    <div id="slf-clanovi" class="clanovi"></div>
    <label class="red-check"><input name="pokreni" type="checkbox"> Pokreni lov odmah (samo za današnji datum)</label>
    <p id="slf-status" class="sitno" role="status"></p>
    <div class="red-dugmadi">
      <button type="submit" class="dugme glavno">Napravi lov</button>
      <button type="button" id="btn-slf-odustani" class="dugme">Odustani</button>
    </div>
  </form>
</section>
