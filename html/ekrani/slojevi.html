<section id="slojevi" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="slojevi-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="slojevi-naslov">Slojevi</h2>
    <button id="btn-slojevi-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <p class="sitno">Granice lovišta, revira i lovnih površina. Uvezeni i preuzeti slojevi ostaju na telefonu i rade bez interneta.</p>
  <div class="red-dugmadi">
    <label class="dugme dugme-fajl">Uvezi fajl (KML, KMZ, GPX, SHP)<input id="slojevi-uvoz" type="file" accept=".kml,.kmz,.gpx,.zip,.shp,.dbf,.prj,.cpg" multiple hidden></label>
    <button id="btn-slojevi-server" class="dugme" type="button">Sa servera (objavio admin)</button>
  </div>
  <p class="sitno">SHP: izaberi zajedno .shp, .dbf i .prj (ili ZIP sa njima).</p>
  <p id="slojevi-status" class="status" role="status"></p>
  <div id="slojevi-server"></div>
  <p id="slojevi-prazno" class="sitno">Nema slojeva na telefonu.</p>
  <ul id="slojevi-spisak" class="spisak"></ul>
</section>
