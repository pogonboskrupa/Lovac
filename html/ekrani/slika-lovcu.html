<section id="slika-lovcu" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="slika-lovcu-naslov" hidden>
  <header class="postavke-glava"><h2 id="slika-lovcu-naslov">Pošalji sliku lovcu</h2>
    <button id="btn-slika-lovcu-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button></header>
  <div id="sl-pregled" class="sl-pregled"></div>
  <label>Kome (najviše 5 lovaca)<input id="sl-trazi" type="search" placeholder="Traži lovca po imenu" autocomplete="off"></label>
  <p id="sl-izabrani" class="sitno"></p>
  <ul id="sl-primaoci" class="spisak sl-primaoci"></ul>
  <label>Poruka uz sliku (neobavezno)<textarea id="sl-opis" rows="2" maxlength="500" placeholder="Npr. trag vepra kod donje čeke"></textarea></label>
  <p class="sitno">Slika je na serveru najviše 12 sati i briše se čim je lovac preuzme. Kod tebe i kod njega ostaje na telefonu. Bez interneta čeka na telefonu i šalje se kad se veza vrati.</p>
  <p id="sl-status" class="sitno" role="status"></p>
  <div class="red-dugmadi">
    <button type="button" id="btn-sl-posalji" class="dugme glavno">Pošalji</button>
    <button type="button" id="btn-sl-odustani" class="dugme">Odustani</button>
  </div>
</section>
