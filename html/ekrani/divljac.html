<section id="divljac" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="divljac-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="divljac-naslov">Divljač</h2>
    <button id="btn-divljac-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <p class="sitno" id="divljac-napomena"></p>
  <input id="divljac-trazi" type="search" placeholder="Traži (vrsta, trag, ishrana…)" aria-label="Traži divljač" autocomplete="off">
  <p id="divljac-prazno" class="sitno" hidden>Nema vrste za taj upit.</p>
  <ul id="divljac-spisak" class="spisak"></ul>
</section>
