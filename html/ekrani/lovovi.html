<section id="lovovi" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="lovovi-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="lovovi-naslov">Zajednički lov</h2>
    <button id="btn-lovovi-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <div class="sk-hero tr-hero ev-hero" id="lovovi-hero">
    <div class="sk-statovi sk-statovi-hero">
      <div><b id="lovh-danas">0</b><span>danas i u toku</span></div>
      <div><b id="lovh-plan">0</b><span>planiranih</span></div>
      <div><b id="lovh-zavrsen">0</b><span>završenih</span></div>
    </div>
  </div>
  <p class="sitno">Raspored preuzmi dok ima interneta — poslije radi i bez signala. Ne zamjenjuje pravila lova ni vođu lova.</p>
  <div class="red-dugmadi">
    <button id="btn-lovovi-osvjezi" class="dugme" type="button">Preuzmi sa servera</button>
    <button id="btn-lov-novi" class="dugme glavno" type="button" hidden>Novi lov</button>
    <button id="btn-lov-reviri" class="dugme" type="button" hidden>Reviri i vođe lova</button>
  </div>
  <p id="lovovi-status" class="sitno" role="status"></p>
  <p id="lovovi-prazno" class="sitno">Nema lovova na telefonu.</p>
  <ul id="lovovi-spisak" class="spisak"></ul>
</section>
