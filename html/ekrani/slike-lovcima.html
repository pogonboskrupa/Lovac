<section id="slike-lovcima" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="slike-lovcima-naslov" hidden>
  <header class="postavke-glava"><h2 id="slike-lovcima-naslov">Slike lovcima</h2>
    <button id="btn-slike-lovcima-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button></header>
  <div class="sk-hero tr-hero ev-hero">
    <div class="sk-statovi sk-statovi-hero">
      <div><b id="slh-primljeno">0</b><span>primljeno</span></div>
      <div><b id="slh-trofeja">0</b><span>trofeja</span></div>
      <div><b id="slh-poslano">0</b><span>poslano</span></div>
    </div>
  </div>
  <div class="red-dugmadi">
    <label class="dugme glavno dugme-fajl">Pošalji slike<input id="sl-ulaz" type="file" accept="image/*" multiple hidden></label>
  </div>
  <div id="sl-tabovi" class="segment p-tabovi" role="group" aria-label="Prikaz slika">
    <button type="button" data-sltab="primljene" aria-pressed="true">Primljene</button>
    <button type="button" data-sltab="poslane" aria-pressed="false">Poslane</button>
  </div>
  <div id="sl-filter" class="segment sl-filter" role="group" aria-label="Vrsta slika"></div>
  <p class="sitno sl-napomena">Čim slika stigne na tvoj telefon, briše se sa servera (najduže se tamo čuva 12 sati). Primljene i poslane slike ostaju u aplikaciji dok ih ne obrišeš; "Sačuvaj na telefon" ih stavlja i u Preuzimanja.</p>
  <ul id="sl-spisak" class="spisak sl-spisak"></ul>
</section>
