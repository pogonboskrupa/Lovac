<section id="opazanje-forma" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="op-naslov" hidden>
  <form id="forma-opazanje" novalidate>
    <header class="postavke-glava"><h2 id="op-naslov">Opažanje</h2><span id="op-vrijeme" class="sitno"></span></header>
    <p id="op-pozicija" class="sitno"></p>
    <h3>Vrsta</h3>
    <div id="op-vrste" class="segment segment-gust" role="group" aria-label="Vrsta divljači"></div>
    <h3>Broj grla</h3>
    <div class="brojac">
      <button id="op-broj-minus" class="ikona-dugme" type="button" aria-label="Manje"><svg class="ic"><use href="#ic-minus"/></svg></button>
      <input name="broj" type="number" inputmode="numeric" min="1" max="999" value="1" aria-label="Broj grla">
      <button id="op-broj-plus" class="ikona-dugme" type="button" aria-label="Više"><svg class="ic"><use href="#ic-plus"/></svg></button>
    </div>
    <h3>Spol / dob</h3>
    <div id="op-kategorija" class="segment segment-gust" role="group" aria-label="Spol i dob"></div>
    <p id="op-upozorenje" class="upozorenje-blok" role="alert" hidden></p>
    <label>Napomena<textarea name="napomena" rows="2" maxlength="1000"></textarea></label>
    <div id="op-foto" class="foto-red"></div>
    <label class="dugme dugme-fajl">Dodaj fotografiju<input id="op-foto-input" type="file" accept="image/*" multiple hidden></label>
    <div class="red-dugmadi">
      <button type="submit" class="dugme glavno">Sačuvaj</button>
      <button type="button" id="btn-op-odustani" class="dugme">Odustani</button>
    </div>
  </form>
</section>
