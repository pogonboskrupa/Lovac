<section id="odstrel-forma" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="ods-naslov" hidden>
  <form id="forma-odstrel" novalidate>
    <header class="postavke-glava"><h2 id="ods-naslov">Odstrel</h2></header>
    <p class="sitno">Evidencija ne zamjenjuje službeni lovački dnevnik.</p>
    <p id="ods-pozicija" class="sitno"></p>
    <h3>Vrsta</h3>
    <div id="ods-vrste" class="segment segment-gust" role="group" aria-label="Vrsta"></div>
    <h3>Spol / dob</h3>
    <div id="ods-kategorija" class="segment segment-gust" role="group" aria-label="Spol i dob"></div>
    <p id="ods-upozorenja" class="upozorenje-blok" role="alert" hidden></p>
    <label>Datum i vrijeme<input name="vrijeme" type="datetime-local"></label>
    <label>Težina (kg)<input name="tezina" inputmode="decimal" placeholder="npr. 18,5"></label>
    <label>Trofej / ocjena<input name="trofej" maxlength="80" placeholder="npr. 105,3 CIC, bronza"></label>
    <label>Odstrijelio<input name="lovac" maxlength="80"></label>
    <label>Napomena<textarea name="napomena" rows="2" maxlength="1000"></textarea></label>
    <div id="ods-foto" class="foto-red"></div>
    <label class="dugme dugme-fajl">Dodaj fotografiju<input id="ods-foto-input" type="file" accept="image/*" multiple hidden></label>
    <label id="ods-u-lov-red" class="red-check" hidden><input type="checkbox" id="ods-u-lov" checked> <span id="ods-u-lov-tekst"></span></label>
    <p id="ods-status" class="status" role="status"></p>
    <div class="red-dugmadi">
      <button id="btn-ods-sacuvaj" type="submit" class="dugme glavno">Sačuvaj</button>
      <button type="button" id="btn-ods-odustani" class="dugme">Odustani</button>
    </div>
  </form>
</section>
