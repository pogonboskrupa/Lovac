<section id="tragovi" class="list-preko" role="dialog" aria-modal="true" aria-labelledby="tragovi-naslov" hidden>
  <header class="postavke-glava">
    <h2 id="tragovi-naslov">Moji tragovi</h2>
    <button id="btn-tragovi-zatvori" class="ikona-dugme" type="button" aria-label="Zatvori"><svg class="ic"><use href="#ic-close"/></svg></button>
  </header>
  <div class="sk-hero tr-hero">
    <div class="sk-statovi sk-statovi-hero">
      <div data-stat="tragova"><b id="tr-stat-broj">0</b><span>tragova</span></div>
      <div data-stat="km"><b id="tr-stat-km">0</b><span>km ukupno</span></div>
      <div data-stat="sati"><b id="tr-stat-sati">0</b><span>sati</span></div>
    </div>
  </div>
  <div class="tr-sedmica" aria-label="Kilometri zadnjih 7 dana">
    <span class="sitno">Zadnjih 7 dana</span>
    <div id="tr-sedmica" class="tr-sedmica-stupci" role="img" aria-label="Kilometri po danima"></div>
  </div>
  <div id="tr-filter" class="segment p-tabovi" role="group" aria-label="Vrsta traga">
    <button type="button" data-tip="svi" aria-pressed="true">Svi</button>
    <button type="button" data-tip="obilazak" aria-pressed="false">Obilasci</button>
    <button type="button" data-tip="potraga" aria-pressed="false">Potrage</button>
  </div>
  <div class="tr-kontrole">
    <label class="tr-sort">Period<select id="tr-period" aria-label="Period"></select></label>
    <label class="tr-sort">Redoslijed<select id="tr-sort" aria-label="Redoslijed"></select></label>
  </div>
  <input id="tr-trazi" type="search" placeholder="Traži trag (naziv, datum)…" aria-label="Traži trag" autocomplete="off">
  <p id="tragovi-prazno" class="sitno">Još nema snimljenih tragova. Snimanje se pokreće dugmetom sa krugom na karti.</p>
  <ul id="tragovi-spisak" class="spisak"></ul>
</section>
