name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Push se nikad ne otkazuje (inače brzi uzastopni pushevi gube Release za međuverzije);
# otkazuju se samo stari pokretanja istog pull requesta.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  sql:
    needs: js
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sql-test.sh

  e2e:
    needs: js
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Runner zna dobiti nepotpune apt spiskove ("Unable to locate package fonts-…"), pa instalacija pada prije ijednog testa.
      - name: Playwright + sistemske zavisnosti (do 3 pokušaja)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && npx playwright install --with-deps chromium && exit 0
            echo "Pokušaj $i nije uspio, čekam…"; sleep $((i * 20))
          done
          exit 1
      - run: npx playwright test --trace off --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/

  apk:
    needs: [sql, e2e]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - id: ver
        run: echo "version=$(grep -oP "APP_VER = '\Kv[0-9]+\.[0-9]+\.[0-9]+" index.html)" >> "$GITHUB_OUTPUT"
      # Link za ažuriranje uvijek vodi na repozitorij iz kojeg je APK napravljen.
      - run: sed -i "s|GITHUB_REPO = '[^']*'|GITHUB_REPO = '${{ github.repository }}'|" static/js/config.js
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Web fajlovi su u APK-u
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/' | tee apk-assets.txt
          grep -q 'assets/www/index.html' apk-assets.txt
          grep -q 'assets/www/static/js/boot.js' apk-assets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            logcat-js.txt
            logcat-sve.txt
            emulator.png

  release:
    needs: [apk, emulator]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Release-i idu jedan po jedan, a "latest" dobija samo najviša verzija.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - id: exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - id: newest
        run: |
          cur=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo v0.0.0)
          top=$(printf '%s\n%s\n' "$cur" "$TAG" | sort -V | tail -1)
          if [ "$top" = "$TAG" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.newest.outputs.latest }}
          files: out/app-debug.apk
          body: |
            APK: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk
      # App provjerava novu verziju preko ovog fajla (raw.githubusercontent nema API limit po IP-u).
      - name: Objavi version.json na granu verzija
        if: steps.exists.outputs.exists == 'false' && steps.newest.outputs.latest == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"verzija":"%s"}\n' "$TAG" > /tmp/version.json
          git checkout -q --orphan verzija-objava
          git rm -rfq .
          cp /tmp/version.json version.json
          git add version.json
          git commit -qm "verzija $TAG"
          git push -f origin HEAD:refs/heads/verzija
      - name: Verzija već postoji
        if: steps.exists.outputs.exists == 'true'
        run: echo "::notice::Release $TAG već postoji — za novi release podigni verziju na tri mjesta."

  pages:
    needs: [sql, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Webapp je samo za razvoj; ako Pages nije uključen, ne ruši CI.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp -r index.html sw.js static _site/
          sed -i "s|GITHUB_REPO = '[^']*'|GITHUB_REPO = '${{ github.repository }}'|" _site/static/js/config.js
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
